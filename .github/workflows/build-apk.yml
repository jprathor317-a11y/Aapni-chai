
name: Build AAPNI CHAI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project files
        run: flutter create . --platforms=android
        
      - name: Add Internet Permission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          permission = '<uses-permission android:name="android.permission.INTERNET"/>'
          if permission not in s:
              s = s.replace('<application', permission + '\n    <application', 1)
              p.write_text(s)
          print("Internet permission checked")
          PY
      - name: Configure Firebase
        run: |
          cp google-services.json android/app/google-services.json
          python3 - <<'PY'
          from pathlib import Path

          settings = next(
              p for p in [
                  Path("android/settings.gradle"),
                  Path("android/settings.gradle.kts")
              ] if p.exists()
          )

          app = next(
              p for p in [
                  Path("android/app/build.gradle"),
                  Path("android/app/build.gradle.kts")
              ] if p.exists()
          )

          kotlin = settings.suffix == ".kts"

          settings_line = (
              'id("com.google.gms.google-services") version "4.4.2" apply false'
              if kotlin else
              'id "com.google.gms.google-services" version "4.4.2" apply false'
          )

          app_line = (
              'id("com.google.gms.google-services")'
              if kotlin else
              'id "com.google.gms.google-services"'
          )

          for path, line in [(settings, settings_line), (app, app_line)]:
              content = path.read_text()
              if line not in content:
                  if "plugins {" not in content:
                      raise Exception(f"plugins block missing in {path}")
                  content = content.replace(
                      "plugins {",
                      "plugins {\n    " + line,
                      1
                  )
                  path.write_text(content)

          print("Firebase Gradle plugin configured")
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AAPNI-CHAI-APK
          path: build/app/outputs/flutter-apk/app-release.apk
